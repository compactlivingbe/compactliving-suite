name: Keep Streamlit awake

# Houdt de Streamlit-app wakker: opent de app als echte browser (Playwright),
# wat de inactiviteits-/sessietimer van Streamlit Community Cloud reset. Slaapt
# de app toch, dan wordt de "Yes, get this app back up!"-knop geklikt.
#
# Standaard elke 2 uur. Slaapt de app toch nog af en toe? Zet de cron op
# "0 * * * *" (elk uur) voor een strakkere marge (kost meer Actions-minuten).

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: "https://compactliving-suite.streamlit.app/"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright-browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Bezoek de app (wakker houden)
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              print("open:", url)
              page.goto(url, wait_until="networkidle", timeout=90000)
              print("na load -> URL:", page.url, "| titel:", page.title())

              def is_asleep():
                  try:
                      body = page.inner_text("body", timeout=5000).lower()
                  except Exception:
                      body = ""
                  return "gone to sleep" in body or "get this app back up" in body

              woke = False
              if is_asleep():
                  print("DETECTIE: app slaapt -> wakker maken")
                  clicked = False
                  for loc in [
                      page.get_by_role("button", name="get this app back up", exact=False),
                      page.get_by_role("link", name="get this app back up", exact=False),
                      page.get_by_text("get this app back up", exact=False),
                  ]:
                      try:
                          if loc.count() > 0:
                              loc.first.click(timeout=10000)
                              clicked = True
                              break
                      except Exception as e:
                          print("klikpoging faalde:", e)
                  print("wakker-knop geklikt:", clicked)
                  woke = True
                  # wachten tot de container opgestart en de app geladen is
                  page.wait_for_timeout(75000)
                  try:
                      page.reload(wait_until="networkidle", timeout=90000)
                  except Exception as e:
                      print("reload:", e)
              else:
                  print("DETECTIE: app was al wakker")

              # Sessie/websocket laten registreren als activiteit.
              page.wait_for_timeout(20000)
              print("EIND -> URL:", page.url, "| titel:", page.title(),
                    "| slaapt nu:", is_asleep(), "| gewekt:", woke)
              browser.close()
          PY
